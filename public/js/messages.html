<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Messages</title>
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/js/authGuard.js"></script>
    <script defer src="/js/logout.js"></script>
  </head>
  <body>
    <header>
      <nav class="nav">
        <a href="/dashboard">Dashboard</a>
        <a href="/browse.html">Browse</a>
        <a href="/listing-new.html">New Listing</a>
        <a href="/my-listings.html">My Listings</a>
        <a href="/messages.html">Messages</a>
        <a href="/profile.html">Profile</a>
        <span class="spacer"></span>
        <button class="btn" id="logoutBtn">Logout</button>
      </nav>
    </header>

    <main class="container">
      <h1 class="h1">Messages</h1>

      <section class="card" style="margin-top:14px;">
        <div class="grid">
          <div class="col-4">
            <h2 class="h2">Inbox</h2>
            <div id="inboxList" class="card" style="margin-top:10px; min-height:260px;"></div>
          </div>

          <div class="col-8">
            <h2 class="h2">Conversation</h2>
            <div id="conversationView" class="card" style="margin-top:10px; min-height:260px;"></div>

            <form id="sendMessageForm" style="margin-top:10px; display:flex; gap:10px;">
              <input id="messageInput" class="input" />
              <button class="btn" type="submit">Send</button>
            </form>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
